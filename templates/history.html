{% extends "base.html" %}

{% block content %}

<h2>Booking History</h2>

<table class="table table-dark table-bordered mt-3">
    <tr>
        <th>ID</th>
        <th>Slot</th>
        <th>Vehicle Number</th>
        <th>Time</th>
    </tr>

    {% for booking in history %}
    <tr>
        <td>{{ booking[0] }}</td>
        <td>{{ booking[1] }}</td>
        <td>{{ booking[2] }}</td>
        <td>{{ booking[3] }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
